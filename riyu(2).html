<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 Hello Kitty 日語小助手</title>
    <style>
        :root {
            --primary-pink: #FFB7C5;
            --secondary-pink: #FF6B8A;
            --light-pink: #FFF0F3;
            --dark-pink: #E54B6E;
            --white: #FFFFFF;
            --text-gray: #555555;
            --text-dark: #333333;
            --border-pink: #FFB7C5;
            --kitty-red: #E53935;
            --kitty-bow: #FF6B8A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Hiragino Kaku Gothic Pro", sans-serif;
        }

        body {
            background: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            gap: 12px;
            position: relative;
        }

        .kitty-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .bg-decoration {
            position: absolute;
            opacity: 0.08;
            font-size: 48px;
        }

        .bg-1 {
            top: 5%;
            left: 5%;
            animation: float 8s ease-in-out infinite;
        }

        .bg-2 {
            top: 20%;
            right: 8%;
            animation: float 10s ease-in-out infinite 1s;
        }

        .bg-3 {
            bottom: 30%;
            left: 15%;
            animation: float 7s ease-in-out infinite 2s;
        }

        .bg-4 {
            bottom: 10%;
            right: 10%;
            animation: float 9s ease-in-out infinite 3s;
        }

        .bg-5 {
            top: 40%;
            left: 80%;
            animation: float 6s ease-in-out infinite 0.5s;
        }

        .bg-6 {
            top: 60%;
            left: 5%;
            animation: float 11s ease-in-out infinite 1.5s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(10deg);
            }
        }

        .navbar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--white), var(--light-pink));
            border-radius: 24px;
            box-shadow: 0 4px 20px rgba(255, 183, 197, 0.3);
            position: sticky;
            top: 12px;
            z-index: 100;
            border: 1px solid var(--border-pink);
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .kitty-icon {
            width: 40px;
            height: 40px;
            background: url(https://img.icons8.com/fluency/48/000000/hello-kitty.png) no-repeat center;
            background-size: contain;
        }

        .app-title {
            font-size: 18px;
            color: var(--secondary-pink);
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 107, 138, 0.2);
        }

        .menu-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--light-pink);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: var(--primary-pink);
            transform: scale(1.1);
        }

        .menu-line {
            width: 22px;
            height: 2.5px;
            background: var(--secondary-pink);
            border-radius: 2px;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, var(--white) 0%, var(--light-pink) 100%);
            box-shadow: -4px 0 24px rgba(255, 183, 197, 0.3);
            padding: 140px 20px 20px;
            /* 增加顶部padding避免与header重叠 */
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            border-left: 2px solid var(--border-pink);
            overflow-y: auto;
            /* 添加滚动条 */
        }

        .side-menu.active {
            right: 0;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 183, 197, 0.3);
            display: none;
            z-index: 999;
            backdrop-filter: blur(4px);
        }

        .menu-overlay.active {
            display: block;
        }

        .menu-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            text-align: center;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            border-radius: 20px;
            color: white;
        }

        .menu-header-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .menu-header-title {
            font-size: 16px;
            font-weight: bold;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            background: var(--white);
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-gray);
            transition: all 0.3s ease;
            border: 1px solid transparent;
            box-shadow: 0 2px 8px rgba(255, 183, 197, 0.1);
        }

        .menu-item:hover {
            background: var(--primary-pink);
            color: var(--text-dark);
            transform: translateX(-5px);
            box-shadow: 0 4px 16px rgba(255, 183, 197, 0.3);
        }

        .menu-item.active {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            color: white;
            border-color: var(--border-pink);
        }

        .menu-item-icon {
            font-size: 22px;
        }

        .stats-panel {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px 16px;
            background: linear-gradient(135deg, var(--white), var(--light-pink));
            border-radius: 24px;
            gap: 10px;
            box-shadow: 0 6px 24px rgba(255, 183, 197, 0.2);
            border: 1px solid var(--border-pink);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 60px;
        }

        .stat-icon {
            font-size: 26px;
            filter: drop-shadow(0 2px 4px rgba(255, 107, 138, 0.3));
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            color: var(--secondary-pink);
            text-shadow: 1px 1px 2px rgba(255, 107, 138, 0.3);
        }

        .stat-label {
            font-size: 11px;
            color: #888;
            text-align: center;
        }

        .checkin-btn {
            padding: 14px 22px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(255, 107, 138, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 138, 0.5);
        }

        .checkin-btn:disabled {
            background: #E0E0E0;
            cursor: not-allowed;
            box-shadow: none;
        }

        .level-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(255, 183, 197, 0.15);
            border: 1px solid var(--border-pink);
        }

        .level-badge {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            box-shadow: 0 3px 10px rgba(255, 107, 138, 0.4);
        }

        .level-bar-container {
            flex: 1;
            height: 12px;
            background: #FFE6ED;
            border-radius: 6px;
            overflow: hidden;
        }

        .level-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-pink), var(--dark-pink));
            transition: width 0.4s ease;
            border-radius: 6px;
        }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(255, 183, 197, 0.15);
            border: 1px solid var(--border-pink);
        }

        .speed-btn {
            padding: 10px 18px;
            border: 2px solid var(--border-pink);
            border-radius: 22px;
            background: var(--white);
            color: var(--text-gray);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .speed-btn.active {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            border-color: var(--secondary-pink);
            color: white;
            box-shadow: 0 3px 12px rgba(255, 107, 138, 0.4);
        }

        .progress-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            background: var(--white);
            border-radius: 18px;
            box-shadow: 0 4px 16px rgba(255, 183, 197, 0.15);
            border: 1px solid var(--border-pink);
        }

        .progress-container {
            flex: 1;
            height: 10px;
            background: #FFE6ED;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary-pink), var(--dark-pink));
            border-radius: 5px;
        }

        .dot-container {
            display: flex;
            gap: 10px;
            padding: 8px;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(255, 183, 197, 0.1);
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #FFE6ED;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            box-shadow: 0 0 8px rgba(255, 107, 138, 0.5);
            transform: scale(1.2);
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            height: 320px;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 28px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            box-shadow: 0 10px 36px rgba(255, 183, 197, 0.3);
            border: 2px solid var(--border-pink);
        }

        .card-front {
            background: linear-gradient(145deg, var(--white), var(--light-pink));
        }

        .card-back {
            background: linear-gradient(145deg, var(--light-pink), #FFE6ED);
            transform: rotateY(180deg);
        }

        .card-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            opacity: 0.8;
        }

        .card-corner-tl {
            top: -8px;
            left: -8px;
        }

        .card-corner-tr {
            top: -8px;
            right: -8px;
        }

        .card-corner-bl {
            bottom: -8px;
            left: -8px;
        }

        .card-corner-br {
            bottom: -8px;
            right: -8px;
        }

        .kana {
            font-size: 42px;
            color: var(--secondary-pink);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 107, 138, 0.3);
        }

        .romaji {
            font-size: 20px;
            color: #666;
            font-style: italic;
        }

        .chinese {
            font-size: 28px;
            color: var(--dark-pink);
            font-weight: bold;
        }

        .example-jp {
            font-size: 16px;
            color: var(--text-dark);
            text-align: center;
            padding: 0 10px;
        }

        .example-cn {
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .collect-icon {
            position: absolute;
            top: 22px;
            right: 22px;
            font-size: 32px;
            cursor: pointer;
            color: var(--primary-pink);
            transition: all 0.3s ease;
            text-shadow: 0 2px 8px rgba(255, 183, 197, 0.4);
        }

        .collect-icon:hover {
            transform: scale(1.2);
        }

        .collect-icon.active {
            color: var(--kitty-red);
            animation: heartbeat 0.6s ease;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }
        }

        .control-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            padding: 14px 16px;
            background: var(--white);
            border-radius: 24px;
            box-shadow: 0 6px 20px rgba(255, 183, 197, 0.15);
            border: 1px solid var(--border-pink);
        }

        .control-btn {
            padding: 14px 24px;
            border: 2px solid var(--border-pink);
            border-radius: 35px;
            background: var(--white);
            color: var(--text-gray);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-btn:hover {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            color: white;
            border-color: var(--secondary-pink);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(255, 107, 138, 0.4);
        }

        .voice-practice-btn {
            background: linear-gradient(135deg, #FF8FAB, #FF6B8A);
            border-color: #FF8FAB;
            color: white;
            box-shadow: 0 4px 14px rgba(255, 143, 171, 0.4);
        }

        .voice-practice-btn:hover {
            background: linear-gradient(135deg, #FF6B8A, #FF4D6D);
            box-shadow: 0 6px 20px rgba(255, 107, 138, 0.5);
        }

        .scene-container {
            width: 100%;
            max-width: 450px;
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .quiz-container {
            width: 100%;
            max-width: 450px;
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .scene-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .scene-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--secondary-pink);
        }

        #sceneList {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .scene-item {
            padding: 16px;
            background: var(--white);
            border: 2px solid var(--border-pink);
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .scene-item:hover {
            background: var(--light-pink);
            border-color: var(--secondary-pink);
            transform: translateY(-2px);
        }

        .scene-item.active {
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            border-color: var(--secondary-pink);
            color: white;
        }

        .scene-dialogue-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dialogue-card {
            flex: 1;
            padding: 24px;
            background: linear-gradient(145deg, var(--white), var(--light-pink));
            border-radius: 20px;
            border: 2px solid var(--border-pink);
            text-align: center;
        }

        .dialogue-kana {
            font-size: 24px;
            font-weight: bold;
            color: var(--secondary-pink);
            margin-bottom: 8px;
        }

        .dialogue-romaji {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }

        .dialogue-chinese {
            font-size: 16px;
            color: #555;
            padding: 10px;
            background: var(--white);
            border-radius: 12px;
            border: 1px solid var(--border-pink);
        }

        .dialogue-speak-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border-pink);
            color: var(--secondary-pink);
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dialogue-speak-btn:hover {
            background: var(--primary-pink);
            border-color: var(--secondary-pink);
        }

        .dialogue-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 10px;
        }

        #dialogueProgress {
            font-size: 14px;
            color: #888;
            min-width: 60px;
            text-align: center;
        }

        .quiz-question-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quiz-question {
            flex: 1;
            font-size: 28px;
            text-align: center;
            padding: 28px;
            background: linear-gradient(145deg, var(--white), var(--light-pink));
            border-radius: 24px;
            box-shadow: 0 6px 22px rgba(255, 183, 197, 0.2);
            border: 2px solid var(--border-pink);
            color: var(--secondary-pink);
            font-weight: bold;
        }

        .quiz-speak-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border-pink);
            color: var(--secondary-pink);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .quiz-speak-btn:hover {
            background: var(--primary-pink);
            border-color: var(--secondary-pink);
        }

        .quiz-option {
            padding: 18px;
            background: var(--white);
            border: 2px solid var(--border-pink);
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }

        .quiz-option:hover:not(:disabled) {
            background: var(--light-pink);
            transform: translateX(5px);
        }

        .quiz-option.correct {
            background: #E8F5E9;
            border-color: #4CAF50;
            color: #2E7D32;
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.3);
        }

        .quiz-option.wrong {
            background: #FFEBEE;
            border-color: #E53935;
            color: #C62828;
            box-shadow: 0 4px 16px rgba(229, 57, 53, 0.3);
        }

        .quiz-next {
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(255, 107, 138, 0.4);
        }

        .quiz-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 138, 0.5);
        }

        .wrong-review-container {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .wrong-review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            background: linear-gradient(135deg, var(--white), var(--light-pink));
            border-radius: 24px;
            box-shadow: 0 6px 22px rgba(255, 183, 197, 0.2);
            border: 1px solid var(--border-pink);
        }

        .wrong-review-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--secondary-pink);
        }

        .wrong-item {
            padding: 18px;
            background: var(--white);
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(255, 183, 197, 0.15);
            border: 1px solid var(--border-pink);
            transition: all 0.3s ease;
        }

        .wrong-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(255, 183, 197, 0.25);
        }

        .wrong-item-kana {
            font-size: 22px;
            color: var(--secondary-pink);
            font-weight: bold;
        }

        .gemini-container {
            width: 100%;
            max-width: 500px;
            display: none;
            flex-direction: column;
            gap: 18px;
            background: var(--white);
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(255, 183, 197, 0.2);
            border: 2px solid var(--border-pink);
        }

        .gemini-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 14px rgba(255, 107, 138, 0.4);
        }

        .gemini-chat-box {
            height: 340px;
            overflow-y: auto;
            padding: 18px;
            background: var(--light-pink);
            border-radius: 20px;
            border: 1px solid var(--border-pink);
        }

        .user-message {
            margin-left: auto;
            background: linear-gradient(135deg, var(--secondary-pink), var(--dark-pink));
            color: white;
            padding: 14px 20px;
            border-radius: 24px 24px 8px 24px;
            max-width: 75%;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(255, 107, 138, 0.3);
        }

        .gemini-message {
            margin-right: auto;
            background: var(--white);
            padding: 14px 20px;

            userData.streak = userData.lastCheckIn === `${yesterday.getFullYear()}-${String(yesterday.getMonth() + 1).padStart(2, '0')}-${String(yesterday.getDate()).padStart(2, '0')}` ? userData.streak + 1 : 1;
            userData.lastCheckIn = getTodayStr();
            addExp(CHECKIN_EXP);
            showToast(`打卡成功！獲得 ${CHECKIN_EXP} 經驗值 🔥`);
        }

        function addExp(amount) {
            userData.exp += amount;
            if (userData.exp < 0) userData.exp = 0;
            let expNeeded = EXP_PER_LEVEL * userData.level;
            while (userData.exp >= expNeeded) {
                userData.exp -= expNeeded;
                userData.level++;
                expNeeded = EXP_PER_LEVEL * userData.level;
                showToast(`🎉 升級了！現在是 Lv.${userData.level}`);
            }
            saveUserData();
            updateStatsUI();
        }

        function showToast(msg) {
            const toast = document.createElement("div");
            toast.className = "checkin-toast";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function saveUserData() {
            userData.wrongAnswers = wrongAnswers;
            localStorage.setItem("japanUserData", JSON.stringify(userData));
        }

        function updateStatsUI() {
            expValue.textContent = userData.exp;
            levelValue.textContent = userData.level;
            streakValue.textContent = userData.streak;
            wrongCount.textContent = wrongAnswers.length;
            const expNeeded = EXP_PER_LEVEL * userData.level;
            levelBar.style.width = (userData.exp / expNeeded * 100) + "%";
            document.getElementById("levelText").textContent = `${userData.exp}/${expNeeded}`;
            checkinBtn.textContent = userData.lastCheckIn === getTodayStr() ? "✅ 已打卡" : "📝 打卡";
            checkinBtn.disabled = userData.lastCheckIn === getTodayStr();
        }

        function addWrongAnswer(word) {
            const existing = wrongAnswers.find(w => w.id === word.id);
            if (existing) existing.wrongCount++;
            else wrongAnswers.push({ ...word, wrongCount: 1 });
            saveUserData();
            updateStatsUI();
        }

        function removeWrongAnswer(id) {
            wrongAnswers = wrongAnswers.filter(w => w.id !== id);
            saveUserData();
            updateStatsUI();
            renderWrongList();
        }

        function renderWrongList() {
            const list = document.getElementById("wrongList");
            list.innerHTML = wrongAnswers.length === 0 ? '<div style="text-align:center;color:#888;padding:40px;">暫無錯題記錄！💪</div>' : '';
            wrongAnswers.forEach(w => {
                const item = document.createElement("div");
                item.className = "wrong-item";
                const deleteBtn = document.createElement("span");
                deleteBtn.style.cssText = "float:right;color:#BBB;cursor:pointer;padding:5px;";
                deleteBtn.textContent = "✕";
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // 阻止事件冒泡
                    removeWrongAnswer(w.id);
                };

                const kanaDiv = document.createElement("div");
                kanaDiv.className = "wrong-item-kana";
                kanaDiv.textContent = w.kana;

                const romajiDiv = document.createElement("div");
                romajiDiv.style.cssText = "font-size:13px;color:#888";
                romajiDiv.textContent = `${w.romaji}（錯誤${w.wrongCount}次）`;

                const chineseDiv = document.createElement("div");
                chineseDiv.style.cssText = "font-size:15px;color:#555";
                chineseDiv.textContent = w.chinese;

                item.appendChild(deleteBtn);
                item.appendChild(kanaDiv);
                item.appendChild(romajiDiv);
                item.appendChild(chineseDiv);

                item.addEventListener("click", () => speakText(w.kana));
                list.appendChild(item);
            });
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            if (!('speechSynthesis' in window)) return;
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "ja-JP";
            u.rate = currentSpeed;
            window.speechSynthesis.speak(u);
        }

        function toggleMenu() {
            sideMenu.classList.toggle("active");
            menuOverlay.classList.toggle("active");
        }

        function handleCategoryChange(type) {
            // 记录之前的类型（除了特殊模式）
            if (type !== "quiz" && type !== "gemini" && type !== "wrong" && type !== "scene") {
                previousType = type;
            }

            currentType = type;
            menuItems.forEach(i => i.classList.remove("active"));
            document.querySelector(`[data-type="${type}"]`).classList.add("active");

            const card = document.getElementById("card"), quiz = document.getElementById("quizContainer");
            const gemini = document.getElementById("geminiContainer"), wrong = document.getElementById("wrongReviewContainer");
            const scene = document.getElementById("sceneContainer");
            const control = document.querySelector(".control-group");
            const speedGroup = document.querySelector(".speed-group");
            const progressWrapper = document.querySelector(".progress-wrapper");
            const dotContainer = document.getElementById("dotContainer");
            const statsPanel = document.querySelector(".stats-panel");
            const levelWrapper = document.querySelector(".level-wrapper");

            if (type === "quiz") {
                card.style.display = "none"; quiz.style.display = "flex"; gemini.style.display = "none"; wrong.style.display = "none"; scene.style.display = "none";
                statsPanel.style.display = "flex"; levelWrapper.style.display = "flex";
                // 测验模式隐藏底部控制组（发音按钮已移到问题旁边）
                control.style.display = "none";
                speedGroup.style.display = "flex"; progressWrapper.style.display = "none"; dotContainer.style.display = "none";
                startQuiz();
            } else if (type === "gemini") {
                card.style.display = "none"; quiz.style.display = "none"; gemini.style.display = "flex"; wrong.style.display = "none"; scene.style.display = "none";
                statsPanel.style.display = "none"; levelWrapper.style.display = "none";
                control.style.display = "none"; speedGroup.style.display = "none"; progressWrapper.style.display = "none"; dotContainer.style.display = "none";
            } else if (type === "wrong") {
                card.style.display = "none"; quiz.style.display = "none"; gemini.style.display = "none"; wrong.style.display = "flex"; scene.style.display = "none";
                statsPanel.style.display = "flex"; levelWrapper.style.display = "flex";
                control.style.display = "none"; speedGroup.style.display = "none"; progressWrapper.style.display = "none"; dotContainer.style.display = "none";
                renderWrongList();
            } else if (type === "scene") {
                card.style.display = "none"; quiz.style.display = "none"; gemini.style.display = "none"; wrong.style.display = "none"; scene.style.display = "flex";
                statsPanel.style.display = "none"; levelWrapper.style.display = "none";
                control.style.display = "none"; speedGroup.style.display = "flex"; progressWrapper.style.display = "none"; dotContainer.style.display = "none";
                renderSceneList();
            } else {
                card.style.display = "block"; quiz.style.display = "none"; gemini.style.display = "none"; wrong.style.display = "none"; scene.style.display = "none";
                statsPanel.style.display = "flex"; levelWrapper.style.display = "flex";
                // 学习模式显示所有按钮
                control.style.display = "flex";
                document.getElementById("prev").style.display = "inline-flex";
                document.getElementById("next").style.display = "inline-flex";
                document.getElementById("voicePractice").style.display = "inline-flex";
                document.getElementById("speak").style.display = "inline-flex";
                speedGroup.style.display = "flex"; progressWrapper.style.display = "flex"; dotContainer.style.display = "flex";
                filterWords();
                renderCard();
            }
        }

        function filterWords() {
            filteredWords = currentType === "collect" ? wordData.filter(w => collectedWords.includes(w.id)) : wordData.filter(w => w.type === currentType);
            currentIndex = 0;
            if (filteredWords.length === 0 && currentType === "collect") {
                alert("暫無收藏！");
                currentType = "greeting";
                filterWords();
            }
            updateProgress();
        }

        function updateProgress() {
            const progress = document.getElementById("progress");
            const progressText = document.getElementById("progressText");
            const dotContainer = document.getElementById("dotContainer");

            progressText.textContent = `${currentIndex + 1}/${filteredWords.length}`;
            progress.style.width = `${((currentIndex + 1) / filteredWords.length) * 100}%`;

            dotContainer.innerHTML = "";
            filteredWords.forEach((_, i) => {
                const dot = document.createElement("div");
                dot.className = `dot ${i === currentIndex ? "active" : ""}`;
                dotContainer.appendChild(dot);
            });
        }

        function renderCard() {
            cardEl.classList.remove("flipped");
            const w = filteredWords[currentIndex];
            document.getElementById("front-kana").textContent = w.kana;
            document.getElementById("front-romaji").textContent = w.romaji;
            document.getElementById("back-chinese").textContent = w.chinese;
            document.getElementById("back-example").textContent = w.example;
            document.getElementById("back-example-cn").textContent = w.exampleCn;
            collectIcon.textContent = collectedWords.includes(w.id) ? "♥" : "♡";
            collectIcon.classList.toggle("active", collectedWords.includes(w.id));
            updateProgress();
        }

        function startQuiz() {
            quizList = [...wordData].sort(() => Math.random() - 0.5).slice(0, QUIZ_TOTAL);
            quizIndex = 0;

            // 绑定测验发音按钮事件
            document.getElementById("quizSpeak").onclick = () => {
                if (quizList[quizIndex]) {
                    speakText(quizList[quizIndex].kana);
                }
            };

            renderQuiz();
        }

        function renderQuiz() {
            const q = quizList[quizIndex];
            const options = [q.chinese];
            while (options.length < 4) {
                const r = wordData[Math.floor(Math.random() * wordData.length)].chinese;
                if (!options.includes(r)) options.push(r);
            }
            options.sort(() => Math.random() - 0.5);

            document.getElementById("quizQuestion").textContent = q.kana;
            const opts = document.getElementById("quizOptions");
            opts.innerHTML = "";
            document.getElementById("quizFeedback").innerHTML = "";
            document.getElementById("quizNext").style.display = "none";

            options.forEach(o => {
                const btn = document.createElement("button");
                btn.className = "quiz-option";
                btn.textContent = o;
                btn.onclick = () => {
                    const allOpts = document.querySelectorAll(".quiz-option");
                    allOpts.forEach(opt => {
                        // 正确答案添加 correct，用户选择的错误答案添加 wrong
                        if (opt.textContent === q.chinese) {
                            opt.classList.add("correct");
                        } else if (opt.textContent === o && o !== q.chinese) {
                            opt.classList.add("wrong");
                        }
                        opt.disabled = true;
                    });
                    document.getElementById("quizFeedback").textContent = o === q.chinese ? "✅ 正確！" : "❌ 錯誤！";
                    if (o === q.chinese) { addExp(CORRECT_EXP); }
                    else { addWrongAnswer(q); addExp(-INCORRECT_EXP); }
                    document.getElementById("quizNext").style.display = "block";
                };
                opts.appendChild(btn);
            });
        }

        document.getElementById("quizNext").onclick = () => {
            quizIndex++;
            if (quizIndex >= QUIZ_TOTAL) {
                // 测验完成，显示选项
                const choice = confirm("測驗完成！🎉\n\n點擊「確定」返回菜單\n點擊「取消」繼續新測驗");
                if (choice) {
                    handleCategoryChange(previousType);
                } else {
                    startQuiz();
                }
            } else {
                renderQuiz();
            }
        };

        document.getElementById("card").addEventListener("click", (e) => {
            // 如果点击的是收藏图标，不翻转卡片
            if (e.target.id === "collect" || e.target.closest(".collect-icon")) return;
            cardEl.classList.toggle("flipped");
        });

        collectIcon.addEventListener("click", (e) => {
            e.stopPropagation(); // 阻止事件冒泡
            const w = filteredWords[currentIndex];
            if (collectedWords.includes(w.id)) {
                collectedWords = collectedWords.filter(id => id !== w.id);
                collectIcon.textContent = "♡";
            } else {
                collectedWords.push(w.id);
                collectIcon.textContent = "♥";
            }
            collectIcon.classList.toggle("active", collectedWords.includes(w.id));
            localStorage.setItem("japanCollected", JSON.stringify(collectedWords));
        });

        document.getElementById("prev").onclick = () => {
            if (currentIndex > 0) { currentIndex--; renderCard(); }
        };

        document.getElementById("next").onclick = () => {
            if (currentIndex < filteredWords.length - 1) { currentIndex++; renderCard(); }
        };

        document.getElementById("speak").onclick = () => {
            speakText(currentType === "quiz" ? quizList[quizIndex].kana : filteredWords[currentIndex].kana);
        };

        // 语音练习功能
        document.getElementById("voicePractice").onclick = async () => {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                showToast("您的瀏覽器不支持語音識別功能 🙁");
                return;
            }

            const word = currentType === "quiz" ? quizList[quizIndex] : filteredWords[currentIndex];
            showToast(`請跟讀：${word.kana} 🎤`);

            // 先播放发音
            speakText(word.kana);

            // 等待发音结束后开始识别
            setTimeout(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                recognition.lang = "ja-JP";
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = async (event) => {
                    const userSpeech = event.results[0][0].transcript;
                    const confidence = event.results[0][0].confidence;

                    // 使用 AI 进行发音评测
                    await evaluatePronunciation(word, userSpeech, confidence);
                };

                recognition.onerror = (event) => {
                    showToast(`語音識別出錯：${event.error} 😅`);
                };

                recognition.start();
            }, 1500);
        };

        async function evaluatePronunciation(word, userSpeech, confidence) {
            try {
                const prompt = `${SOUL_PROMPT}
                
## 評測任務
請評測用戶發音的日語單字：
1. 標準單字：${word.kana}（羅馬音：${word.romaji}，釋義：${word.chinese}）
2. 用戶語音轉寫：${userSpeech}
3. 識別置信度：${confidence}

請指出發音錯誤、重音、節奏問題，給出具體修正建議。使用繁體中文 + Markdown 格式，保持回應精簡。`;

                const response = await fetch(GEMINI_API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-goog-api-key": GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const result = data.candidates[0].content.parts[0].text;
                    showToast(result);
                    addExp(5); // 语音练习奖励经验值
                } else {
                    showToast("評測失敗，請稍後再試 😅");
                }
            } catch (error) {
                // 降级到简单比较
                const normalizedResult = userSpeech.replace(/[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/g, '');
                const normalizedWord = word.kana.replace(/[^\u3040-\u309F\u30A0-\u30FF\u4E00-\u9FAF]/g, '');

                if (normalizedResult === normalizedWord || confidence > 0.7) {
                    showToast(`太棒了！發音很標準！🎉 (${userSpeech})`);
                    addExp(5);
                } else {
                    showToast(`再試一次吧！你說的是：${userSpeech} 📝`);
                }
                console.error("AI 評測失敗，使用本地判定：", error);
            }
        }

        // Gemini AI 对话功能
        const geminiChatBox = document.getElementById("geminiChatBox");
        const geminiInput = document.getElementById("geminiInput");
        const geminiSendBtn = document.getElementById("geminiSendBtn");

        geminiSendBtn.onclick = async () => {
            const question = geminiInput.value.trim();
            if (!question) return;

            // 显示用户消息
            const userMsg = document.createElement("div");
            userMsg.className = "user-message";
            userMsg.textContent = question;
            geminiChatBox.appendChild(userMsg);
            geminiInput.value = "";

            // 显示加载状态
            const loadingMsg = document.createElement("div");
            loadingMsg.className = "gemini-message";
            loadingMsg.textContent = "思考中... 🌸";
            geminiChatBox.appendChild(loadingMsg);
            geminiChatBox.scrollTop = geminiChatBox.scrollHeight;

            try {
                const response = await fetch(`${GEMINI_API_URL}?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                    contents: [{ parts: [{ text: `${SOUL_PROMPT}\n\n以下是用戶的問題：${question}` }] }]
                })
                });

                const data = await response.json();
                loadingMsg.remove();

                const aiMsg = document.createElement("div");
                aiMsg.className = "gemini-message";

                if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    aiMsg.innerHTML = DOMPurify.sanitize(marked.parse(text));
                } else {
                    aiMsg.textContent = "抱歉，我無法回答這個問題 🙀";
                }

                geminiChatBox.appendChild(aiMsg);
                geminiChatBox.scrollTop = geminiChatBox.scrollHeight;
            } catch (error) {
                loadingMsg.remove();
                const errorMsg = document.createElement("div");
                errorMsg.className = "gemini-message";
                errorMsg.textContent = `網絡錯誤，請稍後再試 😿 (${error.message})`;
                geminiChatBox.appendChild(errorMsg);
            }
        };

        // 回车发送
        geminiInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") geminiSendBtn.click();
        });

        document.getElementById("closeWrongReview").onclick = () => {
            document.getElementById("wrongReviewContainer").style.display = "none";
            handleCategoryChange(previousType);
        };

        // 场景对话功能
        let currentScene = null;
        let currentDialogueIndex = 0;

        function renderSceneList() {
            const sceneList = document.getElementById("sceneList");
            sceneList.innerHTML = "";

            sceneData.forEach(scene => {
                const item = document.createElement("div");
                item.className = "scene-item";
                item.textContent = scene.name;
                item.dataset.sceneId = scene.id;
                item.onclick = () => {
                    // 移除其他场景的选中状态
                    document.querySelectorAll(".scene-item").forEach(i => i.classList.remove("active"));
                    item.classList.add("active");
                    selectScene(scene);
                };
                sceneList.appendChild(item);
            });

            // 默认选择第一个场景
            if (sceneData.length > 0) {
                document.querySelector(".scene-item").classList.add("active");
                selectScene(sceneData[0]);
            }
        }

        function selectScene(scene) {
            currentScene = scene;
            currentDialogueIndex = 0;
            renderDialogue();
        }

        function renderDialogue() {
            if (!currentScene || currentScene.dialogues.length === 0) return;

            const dialogue = currentScene.dialogues[currentDialogueIndex];
            document.getElementById("dialogueKana").textContent = dialogue.kana;
            document.getElementById("dialogueRomaji").textContent = dialogue.romaji;
            document.getElementById("dialogueChinese").textContent = dialogue.chinese;
            document.getElementById("dialogueProgress").textContent = `${currentDialogueIndex + 1}/${currentScene.dialogues.length}`;
        }

        document.getElementById("dialogueSpeak").onclick = () => {
            if (currentScene && currentScene.dialogues[currentDialogueIndex]) {
                speakText(currentScene.dialogues[currentDialogueIndex].kana);
            }
        };

        document.getElementById("prevDialogue").onclick = () => {
            if (!currentScene) return;
            currentDialogueIndex = (currentDialogueIndex - 1 + currentScene.dialogues.length) % currentScene.dialogues.length;
            renderDialogue();
        };

        document.getElementById("nextDialogue").onclick = () => {
            if (!currentScene) return;
            currentDialogueIndex = (currentDialogueIndex + 1) % currentScene.dialogues.length;
            renderDialogue();
        };

        document.getElementById("closeScene").onclick = () => {
            handleCategoryChange(previousType);
        };

        document.querySelectorAll(".speed-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                currentSpeed = parseFloat(btn.dataset.rate);
            });
        });

        menuBtn.addEventListener("click", toggleMenu);
        menuOverlay.addEventListener("click", toggleMenu);

        menuItems.forEach(item => {
            item.addEventListener("click", () => {
                handleCategoryChange(item.dataset.type);
                toggleMenu();
            });
        });

        checkinBtn.addEventListener("click", doCheckIn);

        async function initApp() {
            await loadSoulFile();
            updateStatsUI();
            filterWords();
            renderCard();
        }

        window.onload = initApp;
    </script>
